<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verified - Task Reward System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      background: #2563eb;
      color: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    h1 {
      color: #111827;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .check-icon {
      font-size: 58px;
      margin-bottom: 12px;
    }

    .status {
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
      background: #dcfce7;
      color: #166534;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
      margin-top: 10px;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      💰
    </div>

    <div class="check-icon">
      ✅
    </div>

    <h1>Task Reward System</h1>

    <p class="subtitle">
      Email Verification
    </p>

    <div class="status">
      <strong>Your email has been verified.</strong>
      <br>
      You can now sign in with your new account.
    </div>

    <a
      href="index.html"
      class="btn">
      🔐 Continue to Login
    </a>

    <div class="footer">
      © 2026 Task Reward System
    </div>

  </div>

</body>
</html>
