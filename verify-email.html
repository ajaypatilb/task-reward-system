<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Email Verification - Task Reward System</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px 22px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .info {
      color: #555;
    }

    .code {
      margin-top: 15px;
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #222;
      color: white;

      border-radius: 8px;
    }
  </style></head><body>  <div class="card"><h1>📧 Email Verification</h1>

<div id="status" class="info">
  Checking verification link...
</div>

<div id="details"></div>

<a href="index.html">Go to Login</a>

  </div>  <script type="module">

    import { initializeApp } 
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      checkActionCode,
      applyActionCode
    } 
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      updateDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================================================
    // FIREBASE CONFIG
    // DO NOT CHANGE
    // =========================================================

    const firebaseConfig = {
      apiKey: "AIzaSyCEOuuahhOU7RLb8FjaCkYMudT446645Lg",
      authDomain: "task-reward-system-af46f.firebaseapp.com",
      projectId: "task-reward-system-af46f",
      storageBucket: "task-reward-system-af46f.firebasestorage.app",
      messagingSenderId: "64322126165",
      appId: "1:64322126165:web:7aae7a6e4792ab4f092fdc",
      measurementId: "G-6P3R9F3ZQT"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    const statusBox = document.getElementById("status");
    const detailsBox = document.getElementById("details");


    function showError(error) {

      console.error("Firebase verification error:", error);

      statusBox.className = "error";
      statusBox.innerHTML =
        "<strong>❌ Verification Failed</strong>";

      detailsBox.innerHTML = `
        <div class="code">
          <strong>Error Code:</strong><br>
          ${error.code || "Unknown"}<br><br>

          <strong>Error Message:</strong><br>
          ${error.message || "Unknown error"}
        </div>
      `;
    }


    async function verifyEmail() {

      const params = new URLSearchParams(
        window.location.search
      );

      const mode = params.get("mode");
      const actionCode = params.get("oobCode");
      const apiKeyFromUrl = params.get("apiKey");
      const lang = params.get("lang");


      console.log("Mode:", mode);
      console.log("oobCode:", actionCode);
      console.log("API Key:", apiKeyFromUrl);
      console.log("Language:", lang);


      // ---------------------------------------------------------
      // Check Mode
      // ---------------------------------------------------------

      if (mode !== "verifyEmail") {

        statusBox.className = "error";

        statusBox.innerHTML =
          "<strong>❌ Invalid verification mode</strong>";

        detailsBox.innerHTML = `
          <div class="code">
            Expected:<br>
            mode=verifyEmail<br><br>

            Received:<br>
            ${mode || "missing"}
          </div>
        `;

        return;
      }


      // ---------------------------------------------------------
      // Check oobCode
      // ---------------------------------------------------------

      if (!actionCode) {

        statusBox.className = "error";

        statusBox.innerHTML =
          "<strong>❌ Verification code is missing</strong>";

        return;
      }


      try {

        statusBox.className = "info";

        statusBox.innerHTML =
          "🔍 Checking Firebase verification code...";


        // -------------------------------------------------------
        // Step 1: Check Action Code
        // -------------------------------------------------------

        const info = await checkActionCode(
          auth,
          actionCode
        );


        console.log("Action code info:", info);


        // -------------------------------------------------------
        // Get email associated with verification code
        // -------------------------------------------------------

        const email =
          info.data.email || "";


        // -------------------------------------------------------
        // Step 2: Apply Verification Code
        // -------------------------------------------------------

        await applyActionCode(
          auth,
          actionCode
        );


        // -------------------------------------------------------
        // Step 3: Find Firebase user
        // -------------------------------------------------------

        let verifiedUid = null;


        /*
          Firebase verification action itself does not
          automatically sign the browser into that account.

          Therefore we cannot safely invent a UID here.

          The actual Firebase Auth account will show
          emailVerified=true after the user logs in again.
        */


        // -------------------------------------------------------
        // Success
        // -------------------------------------------------------

        statusBox.className = "success";

        statusBox.innerHTML =
          "<strong>✅ Email Verified Successfully!</strong>";


        detailsBox.innerHTML = `
          <div class="code">
            <strong>Verified Email:</strong><br>
            ${email || "Email verified"}<br><br>

            <strong>Firebase Action:</strong><br>
            verifyEmail<br><br>

            <strong>Status:</strong><br>
            Firebase email verification completed.
          </div>

          <p style="margin-top:18px;">
            Please go to Login and sign in again.
          </p>
        `;


      } catch (error) {

        showError(error);

      }

    }


    verifyEmail();

  </script></body>
</html>
