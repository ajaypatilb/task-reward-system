<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Registration - Task Reward System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      background: #2563eb;
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #1d4ed8;
    }

    .register-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .login-text a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">👤</div>

    <h1>Create Member Account</h1>

    <p class="subtitle">
      Join Task Reward System
    </p>

    <form id="registerForm">

      <!-- Full Name -->
      <div class="input-group">
        <label>Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required>
      </div>

      <!-- Mobile -->
      <div class="input-group">
        <label>Mobile Number</label>

        <input
          type="tel"
          id="mobile"
          placeholder="Enter 10-digit mobile number"
          maxlength="10"
          inputmode="numeric"
          required>
      </div>

      <!-- Password -->
      <div class="input-group">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter your password"
          minlength="6"
          required>
      </div>

      <button
        type="submit"
        class="register-btn"
        id="registerBtn">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-text">
      Already have an account?
      <a href="index.html">Login</a>
    </div>

    <div class="footer">
      © 2026 Task Reward System
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyAH030c2ydOmijyUwmT60CC7vvnyXxyOdY",

      authDomain:
        "task-reward-system-af46f.firebaseapp.com",

      projectId:
        "task-reward-system-af46f",

      storageBucket:
        "task-reward-system-af46f.firebasestorage.app",

      messagingSenderId:
        "64322126165",

      appId:
        "1:64322126165:web:7aae7a6e4792ab4f092fdc",

      measurementId:
        "G-6P3R9F3ZQT"
    };


    // ==========================================
    // FIREBASE INITIALIZE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }


    // ==========================================
    // REGISTRATION
    // ==========================================

    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();


        const name =
          document.getElementById("name")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const mobile =
          document.getElementById("mobile")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;

        const registerBtn =
          document.getElementById("registerBtn");


        // ======================================
        // VALIDATION
        // ======================================

        if (mobile.length !== 10) {

          showMessage(
            "Please enter a valid 10-digit mobile number.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;
        }


        registerBtn.disabled = true;

        registerBtn.textContent =
          "Creating Account...";


        try {

          // ====================================
          // CREATE FIREBASE AUTH ACCOUNT
          // ====================================

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          // ====================================
          // CREATE FIRESTORE USER PROFILE
          // ====================================

          await setDoc(
            doc(db, "users", user.uid),
            {

              name: name,

              email: email,

              mobile: mobile,

              role: "member",

              coins: 0,

              status: "active",

              createdAt: serverTimestamp()

            }
          );


          // ====================================
          // SUCCESS
          // ====================================

          showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
          );


          setTimeout(function() {

            window.location.href =
              "index.html";

          }, 1500);


        } catch (error) {

          console.error(error);


          let errorMessage =
            "Registration failed. Please try again.";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            errorMessage =
              "This email is already registered.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            errorMessage =
              "Please enter a valid email.";

          } else if (
            error.code ===
            "auth/weak-password"
          ) {

            errorMessage =
              "Password is too weak. Use at least 6 characters.";

          } else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            errorMessage =
              "Network error. Please check your internet.";

          }


          showMessage(
            errorMessage,
            "error"
          );


        } finally {

          registerBtn.disabled = false;

          registerBtn.textContent =
            "Create Account";
        }

      });

  </script>

</body>
</html>
