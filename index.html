<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Reward System - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      background: #2563eb;
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;

    .role-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #374151;
    }

    .role-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    .input-group {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;

      cursor: pointer;
      margin-top: 10px;
      display: none;
    }

    .resend-btn:hover {
      background: #374151;
    }

    .resend-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      background: #fee2e2;

    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .register-text {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;

    }

    .register-text a {
      color: #2563eb;

      text-decoration: none;
    }

    .register-text a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">💰</div>

    <h1>Task Reward System</h1>

    <p class="subtitle">
      Complete tasks and earn rewards
    </p>


    <!-- Role Selection -->
    <div class="role-buttons">

      <button
        type="button"
        class="role-btn active"
        id="memberBtn"
        onclick="selectRole('member')">
        👤 Member
      </button>

      <button
        type="button"
        class="role-btn"
        id="ownerBtn"
        onclick="selectRole('owner')">
        👑 Owner
      </button>

    </div>


    <!-- Login Form -->
    <form id="loginForm">

      <div class="input-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="input-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn">
        Login
      </button>

    </form>


    <!-- Resend Verification -->
    <button
      type="button"
      class="resend-btn"
      id="resendBtn">
      📧 Resend Verification Email
    </button>


    <div
      id="message"
      class="message">
    </div>


    <div
      class="register-text"
      id="registerText">

      New Member?
      <a href="register.html">Register</a>

    </div>


    <div class="footer">
      © 2026 Task Reward System
    </div>

  </div>


  <!-- Firebase SDK -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      signOut,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCEOuuahhOU7RLb8FjaCkYMudT446645Lg",

      authDomain:
        "task-reward-system-af46f.firebaseapp.com",

      projectId:
        "task-reward-system-af46f",

      storageBucket:
        "task-reward-system-af46f.firebasestorage.app",

      messagingSenderId:
        "64322126165",

      appId:
        "1:64322126165:web:7aae7a6e4792ab4f092fdc",

      measurementId:
        "G-6P3R9F3ZQT"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==========================================
    // AUTH PERSISTENCE
    // ==========================================

    try {

      await setPersistence(
        auth,
        browserLocalPersistence
      );

      console.log(
        "Firebase Auth persistence enabled."
      );

    } catch(error) {

      console.error(
        "Auth persistence error:",
        error
      );

    }


    // ==========================================
    // ROLE
    // ==========================================

    let selectedRole = "member";


    // ==========================================
    // CURRENT UNVERIFIED USER
    // ==========================================

    let unverifiedUser = null;


    // ==========================================
    // SELECT ROLE
    // ==========================================

    window.selectRole = function(role) {

      selectedRole = role;

      const memberBtn =
        document.getElementById("memberBtn");

      const ownerBtn =
        document.getElementById("ownerBtn");

      const registerText =
        document.getElementById("registerText");

      const resendBtn =
        document.getElementById("resendBtn");


      memberBtn.classList.remove("active");

      ownerBtn.classList.remove("active");


      if(role === "member") {

        memberBtn.classList.add("active");

        registerText.style.display =
          "block";

      } else {

        ownerBtn.classList.add("active");

        registerText.style.display =
          "none";

        resendBtn.style.display =
          "none";

        unverifiedUser = null;

      }

    };


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";
    }


    // ==========================================
    // RESEND VERIFICATION EMAIL
    // ==========================================

    document
      .getElementById("resendBtn")
      .addEventListener(
        "click",
        async function() {

          const resendBtn =
            document.getElementById("resendBtn");


          if(!unverifiedUser) {

            showMessage(
              "Please login again to resend the verification email.",
              "error"
            );

            return;
          }


          resendBtn.disabled = true;

          resendBtn.textContent =
            "Sending...";


          try {

            await sendEmailVerification(
              unverifiedUser
            );


            showMessage(
              "New verification email sent. Please open the latest email and click the verification link.",
              "success"
            );


          } catch(error) {

            console.error(
              "Resend verification error:",
              error
            );


            let errorMessage =
              "Could not send verification email. Please try again.";


            if(
              error.code ===
              "auth/too-many-requests"
            ) {

              errorMessage =
                "Too many verification requests. Please wait a while before trying again.";

            }

            else if(
              error.code ===
              "auth/network-request-failed"
            ) {

              errorMessage =
                "Network error. Please check your internet connection.";

            }


            showMessage(
              errorMessage,
              "error"
            );

          } finally {

            resendBtn.disabled =
              false;

            resendBtn.textContent =
              "📧 Resend Verification Email";

          }

        }
      );


    // ==========================================
    // LOGIN
    // ==========================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;

          const loginBtn =
            document
              .getElementById("loginBtn");

          const resendBtn =
            document
              .getElementById("resendBtn");


          // Hide old resend button
          resendBtn.style.display =
            "none";

          unverifiedUser = null;


          loginBtn.disabled = true;

          loginBtn.textContent =
            "Logging in...";


          try {

            // ==================================
            // PERSISTENCE
            // ==================================

            await setPersistence(
              auth,
              browserLocalPersistence
            );


            // ==================================
            // FIREBASE LOGIN
            // ==================================

            const userCredential =
              await signInWithEmailAndPassword(
                auth,
                email,
                password
              );


            let user =
              userCredential.user;


            // ==================================
            // GET LATEST EMAIL VERIFIED STATUS
            // ==================================

            await user.reload();


            // Get refreshed user object
            user = auth.currentUser;


            console.log(
              "Login successful:",
              user.uid
            );

            console.log(
              "Email verified:",
              user.emailVerified
            );


            // ==================================
            // MEMBER EMAIL VERIFICATION
            // ==================================

            if(selectedRole === "member") {

              if(!user.emailVerified) {

                // Keep user temporarily available
                // so resend button can work
                unverifiedUser = user;


                showMessage(
                  "Your email is not verified yet. Please verify your email before entering the Member Dashboard.",
                  "error"
                );


                resendBtn.style.display =
                  "block";


                // Sign out after keeping reference.
                // The resend button will ask user
                // to login again if necessary.
                await signOut(auth);

                return;
              }

            }


            // ==================================
            // GET USER PROFILE
            // ==================================

            const userRef =
              doc(
                db,
                "users",
                user.uid
              );


            const userSnap =
              await getDoc(userRef);


            if(!userSnap.exists()) {

              showMessage(
                "User profile not found.",
                "error"
              );

              await signOut(auth);

              return;
            }


            const userData =
              userSnap.data();


            // ==================================
            // CHECK ROLE
            // ==================================

            if(
              userData.role !==
              selectedRole
            ) {

              showMessage(
                "You do not have permission to login as " +
                selectedRole +
                ".",
                "error"
              );

              await signOut(auth);

              return;
            }


            // ==================================
            // CHECK ACCOUNT STATUS
            // ==================================

            if(
              userData.status &&
              userData.status !== "active"
            ) {

              showMessage(
                "Your account is not active.",
                "error"
              );

              await signOut(auth);

              return;
            }


            // ==================================
            // LOGIN SUCCESS
            // ==================================

            showMessage(
              "Login successful!",
              "success"
            );


            // ==================================
            // REDIRECT
            // ==================================

            setTimeout(
              function() {

                if(
                  selectedRole ===
                  "owner"
                ) {

                  window.location.href =
                    "owner.html";

                } else {

                  window.location.href =
                    "member.html";

                }

              },
              800
            );


          } catch(error) {

            console.error(
              "Login error:",
              error
            );


            let errorMessage =
              "Login failed. Please try again.";


            if(
              error.code ===
              "auth/invalid-credential"
            ) {

              errorMessage =
                "Invalid email or password.";

            }

            else if(
              error.code ===
              "auth/user-not-found"
            ) {

              errorMessage =
                "User account not found.";

            }

            else if(
              error.code ===
              "auth/wrong-password"
            ) {

              errorMessage =
                "Incorrect password.";

            }

            else if(
              error.code ===
              "auth/invalid-email"
            ) {

              errorMessage =
                "Please enter a valid email.";

            }

            else if(
              error.code ===
              "auth/too-many-requests"
            ) {

              errorMessage =
                "Too many login attempts. Please try again later.";

            }

            else if(
              error.code ===
              "auth/network-request-failed"
            ) {

              errorMessage =
                "Network error. Please check your internet connection.";

            }


            showMessage(
              errorMessage,
              "error"
            );


          } finally {

            loginBtn.disabled =
              false;

            loginBtn.textContent =
              "Login";

          }

        }
      );

  </script>

</body>
</html>
